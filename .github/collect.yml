name: collect-daily-snapshot

on:
  schedule:
    - cron: "17 6 * * *"      # every day at 06:17 UTC
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write             # needed to commit the updated dataset

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Collect today's snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # raises the API limit to 5000 req/hour
        run: python -m tracker collect
      - name: Rebuild report
        run: python -m tracker report
      - name: Commit updated data
        run: |
          git config user.name  "data-tracker-bot"
          git config user.email "data-tracker-bot@users.noreply.github.com"
          git add data/snapshots.csv reports/
          git diff --staged --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
